server:
  port: 8081

spring:
  application:
    name: booking-service

# Redis
  data:
    redis:
      host: localhost
      port: 6379

 # Kafka
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: booking-group
      auto-offset-reset: earliest
    producer:
      acks: all
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

  # Observability
  management:
    tracing:
      sampling:
        probability: 1.0
      baggage:
        correlation:
          enabled: true
    zipkin:
      tracing:
        endpoint: http://localhost:9411/api/v2/spans
logging:
 pattern:
    # Переопределяем ВЕСЬ вывод в консоль
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [traceId=%X{traceId:-}, spanId=%X{spanId:-}] %logger{36} - %msg%n"
